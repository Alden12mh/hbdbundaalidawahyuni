<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Membuat warna gradien bergerak */
            background-size: 400% 400%;
            animation: gradientBG 25s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi untuk gambar/ikon yang melayang */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.9; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-120vh) scale(1.5) rotate(360deg); opacity: 0.9; }
        }
        
        .floating-item {
            position: fixed;
            bottom: -100px;
            animation: floatUp infinite linear;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Tambahan pola background polkadot samar agar tidak terlalu kosong */
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: radial-gradient(rgba(255, 105, 180, 0.2) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes scrollRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }
        
        .scrolling-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Di bawah kotak utama, tapi di atas polkadot */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            overflow: hidden;
            pointer-events: none; /* Agar foto tidak mengganggu klik tombol */
            opacity: 0.9; /* Dibuat lebih jelas dari 0.45 menjadi 0.9 */
        }
        
        .scrolling-track {
            display: flex;
            gap: 20px;
            width: max-content;
        }
        
        .track-left {
            /* Scroll lambat 25 detik */
            animation: scrollLeft 25s linear infinite;
        }
        
        .track-right {
            /* Scroll lambat 25 detik */
            animation: scrollRight 25s linear infinite;
        }
        
        .scrolling-img {
            height: 260px; /* Tinggi diseragamkan untuk satu baris */
            width: auto; /* Lebar otomatis mengikuti proporsi asli foto agar tidak ada yang terpotong */
            border-radius: 8px; /* Sudut sedikit melengkung agar tetap rapi tanpa bingkai putih */
        }

        /* ===== EFEK POLAROID ===== */
        .polaroid-container {
            background: white;
            padding: 16px;
            padding-bottom: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 0, 0, 0.15);
            transform: perspective(1000px) rotateX(2deg) rotateY(-3deg);
            transition: transform 0.3s ease;
        }

        .polaroid-container:hover {
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
        }

        .polaroid-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background: #f5f5f5;
        }

        .polaroid-text {
            margin-top: 12px;
            font-family: 'Marker Felt', cursive, sans-serif;
            font-size: 1.1rem;
            color: #333;
            text-align: center;
            font-style: italic;
            font-weight: normal;
        }
    </style>
</head>

    <div class="fixed inset-0 pointer-events-none z-0">

    <!-- Tambahkan z-10 di sini agar kotak tidak tertutup elemen yang melayang -->

        <!-- Pemutar Audio HTML5 (Siapkan file lagu-jamrud.mp3 di folder yang sama) -->
        <audio id="bg-music" src="lagu-jamrud.mp3" preload="auto"></audio>

        <!-- Tampilan Awal -->
        <div id="start-box" class="transition-all duration-500 ease-in-out transform scale-100 opacity-100 relative z-10">
            <div class="text-7xl mb-6 animate-bounce">🎁</div>
            <h2 class="text-2xl font-bold text-rose-500 mb-8 leading-snug">Ada pesan rahasia untuk Ibu...</h2>
            <button onclick="bukaKejutan()" class="bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:shadow-rose-400/50 hover:scale-105 transition-all duration-300 active:scale-95 text-lg w-full sm:w-auto">
                Buka Sekarang
            </button>
        </div>

        <!-- Tampilan Setelah Diklik -->

            <div class="w-56 mx-auto mb-6">
                <div class="polaroid-container">

            </h1>

                </p>
            </div>

    <script>
        // Fungsi utama saat tombol ditekan
        function bukaKejutan() {
            // Sembunyikan kotak awal perlahan
            let startBox = document.getElementById('start-box');
            startBox.classList.remove('scale-100', 'opacity-100');
            startBox.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                startBox.classList.add('hidden');
                
                // Munculkan kotak kejutan
                let surprise = document.getElementById('surprise-box');
                surprise.classList.remove('hidden');
                
                // Pemicu Animasi CSS
                setTimeout(() => {
                    surprise.classList.remove('opacity-0', 'scale-95');
                    surprise.classList.add('opacity-100', 'scale-100');
                }, 50);
            }, 300);

            // Mainkan Lagu dari file MP3 lokal
            let audio = document.getElementById('bg-music');
            if (audio) {
                audio.play().catch(e => console.log("Gagal memutar audio:", e));
            }

            // Mulai Kembang Api
            mulaiKembangApi();
        }

        // Fungsi memunculkan kembang api (Canvas Confetti)
        function mulaiKembangApi() {
            // Ledakan utama yang besar saat tombol baru ditekan
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 },
                zIndex: 100,
                colors: ['#ff0000', '#ff69b4', '#ff1493', '#ffd700', '#ffffff']
            });

            // Ledakan berkelanjutan dari sisi kiri dan kanan (durasi 15 detik)
            var duration = 15 * 1000; 
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Tembakan kembang api dari sisi kiri bawah
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff0000', '#ff69b4', '#ff1493', '#ffd700', '#ffffff']
                }));
                
                // Tembakan kembang api dari sisi kanan bawah
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff0000', '#ff69b4', '#ff1493', '#ffd700', '#ffffff']
                }));
            }, 250);
        }
    </script>
